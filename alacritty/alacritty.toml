# Alacritty — configuración (colores en themes/)
# Formato TOML (Alacritty >= 0.13)

[general]
live_config_reload = true
# Los colores van en archivos aparte. El segundo gana al primero: dynamic.toml
# está vacío salvo que un escritorio con tema dinámico (desktops/dhruv) lo rellene.
import = [
  "~/.config/alacritty/themes/catppuccin-mocha.toml",
  "~/.config/alacritty/dynamic.toml",
]

[window]
padding = { x = 16, y = 16 }
opacity = 0.95
dynamic_title = true
# "Full" funciona en cualquier entorno. En un WM de mosaico (Hyprland, Niri,
# bspwm…) puedes usar "None" para quitar la barra de título.
decorations = "Full"

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true
