# Plantilla de matugen para Alacritty (Material You).
# matugen la renderiza con los colores del wallpaper en
# ~/.config/alacritty/dynamic.toml, que alacritty.toml importa después del
# tema Catppuccin y por eso lo sustituye.
#
# Material You no tiene tonos ANSI, así que el reparto es una elección:
# rojo = error (siempre rojo) y el resto sale del acento, secundario y terciario.

[colors.primary]
background = "{{ colors.surface.default.hex }}"
foreground = "{{ colors.on_surface.default.hex }}"
dim_foreground = "{{ colors.outline.default.hex }}"
bright_foreground = "{{ colors.on_surface.default.hex }}"

[colors.cursor]
text = "{{ colors.surface.default.hex }}"
cursor = "{{ colors.primary.default.hex }}"

[colors.vi_mode_cursor]
text = "{{ colors.surface.default.hex }}"
cursor = "{{ colors.tertiary.default.hex }}"

[colors.selection]
text = "{{ colors.on_primary_container.default.hex }}"
background = "{{ colors.primary_container.default.hex }}"

[colors.search.matches]
foreground = "{{ colors.on_secondary_container.default.hex }}"
background = "{{ colors.secondary_container.default.hex }}"

[colors.search.focused_match]
foreground = "{{ colors.on_primary.default.hex }}"
background = "{{ colors.primary.default.hex }}"

[colors.footer_bar]
foreground = "{{ colors.on_surface_variant.default.hex }}"
background = "{{ colors.surface_container_high.default.hex }}"

[colors.hints.start]
foreground = "{{ colors.on_tertiary.default.hex }}"
background = "{{ colors.tertiary.default.hex }}"

[colors.hints.end]
foreground = "{{ colors.on_surface.default.hex }}"
background = "{{ colors.surface_container_high.default.hex }}"

[colors.normal]
black = "{{ colors.surface_container_highest.default.hex }}"
red = "{{ colors.error.default.hex }}"
green = "{{ colors.tertiary.default.hex }}"
yellow = "{{ colors.secondary.default.hex }}"
blue = "{{ colors.primary.default.hex }}"
magenta = "{{ colors.tertiary_fixed_dim.default.hex }}"
cyan = "{{ colors.secondary_fixed_dim.default.hex }}"
white = "{{ colors.on_surface_variant.default.hex }}"

[colors.bright]
black = "{{ colors.outline.default.hex }}"
red = "{{ colors.error.default.hex }}"
green = "{{ colors.tertiary_fixed.default.hex }}"
yellow = "{{ colors.secondary_fixed.default.hex }}"
blue = "{{ colors.primary_fixed.default.hex }}"
magenta = "{{ colors.tertiary_fixed_dim.default.hex }}"
cyan = "{{ colors.secondary_fixed_dim.default.hex }}"
white = "{{ colors.on_surface.default.hex }}"
