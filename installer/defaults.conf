# defaults.conf — valores por defecto de arch-install.sh.
# Se carga como shell; cualquier flag de la línea de comandos tiene prioridad.
# Edita este archivo para que tu instalación siempre salga igual.

# Kernel: linux-zen (por defecto), linux, linux-lts o linux-hardened
KERNEL=linux-zen

# Distribución de teclado de la consola (y del sistema instalado)
KEYMAP=us

# Zona horaria (ls /usr/share/zoneinfo) y locales
TIMEZONE=America/Tijuana
LOCALE=en_US.UTF-8
EXTRA_LOCALES="es_MX.UTF-8"

# Modo de instalación: whole (borra el disco entero) o dualboot (usa el espacio
# libre del disco y respeta las particiones que ya existen)
INSTALL_MODE=whole

# Sistema de archivos de la raíz: btrfs (con subvolúmenes) o ext4
FILESYSTEM=btrfs

# Tamaño de la partición EFI cuando hay que crearla, en MiB
ESP_SIZE_MIB=1024

# Espacio libre mínimo (GiB) que exige el modo dualboot
MIN_ROOT_GIB=30

# Nombre del equipo si no se indica con --hostname
DEFAULT_HOSTNAME=arch
