# ~/.config/tmux/tmux.conf — tmux con Catppuccin Mocha (sin plugins)
# Ábrelo con `tm` (ver bash/.bashrc): elige un directorio y abre su sesión.

# Colores reales y portapapeles
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on

# Comportamiento
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 50000
set -g focus-events on

# Barra de estado
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I #W "
set -g window-status-separator ""

# Paneles y mensajes
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
